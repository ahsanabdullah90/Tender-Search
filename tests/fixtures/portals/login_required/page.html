<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portal Authentication Required</title>
</head>
<body>
  <div class="login-box">
    <h2>Please sign in to access procurement opportunities</h2>
    <form action="/login" method="post">
      <input type="text" name="username" placeholder="Username / Email" />
      <input type="password" name="password" placeholder="Password" />
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
